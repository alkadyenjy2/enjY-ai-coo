name: Finalize Telegram Integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Wire Telegram route and env contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text()
          marker = 'app.use("/api/clinic", clinicRouter);'
          route = 'app.use("/api/telegram", createTelegramRouter());'
          if route not in s:
              if marker not in s:
                  raise SystemExit('clinic route marker not found')
              s = s.replace(marker, marker + '\n' + route, 1)
          p.write_text(s)
          e = Path('.env.example')
          es = e.read_text()
          block = '\n# TELEGRAM BOT / WEBHOOK\n# Store real values only in deployment secrets; never commit tokens.\nTELEGRAM_BOT_TOKEN=\nTELEGRAM_WEBHOOK_SECRET=\n'
          if 'TELEGRAM_BOT_TOKEN=' not in es:
              e.write_text(es.rstrip() + block)
          PY
      - name: Verify
        run: |
          npm run lint
          npm run build
          grep -q 'app.use("/api/telegram", createTelegramRouter())' server.ts
          grep -q 'TELEGRAM_BOT_TOKEN=' .env.example
      - name: Commit and retire workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts .env.example
          git commit -m 'feat(telegram): finalize webhook route wiring' || true
          git push
          git rm .github/workflows/finalize-telegram.yml
          git commit -m 'chore: retire telegram finalize workflow'
          git push
