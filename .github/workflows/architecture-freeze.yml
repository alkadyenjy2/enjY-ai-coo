name: Architecture Freeze Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  core-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: node --import tsx --test --test-concurrency=1 tests/architecture-freeze.test.ts
