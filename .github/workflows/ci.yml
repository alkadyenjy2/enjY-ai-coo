name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install

      - name: Install MemPalace
        run: python -m pip install 'mempalace==3.9.0'

      - name: Lint / typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: NO EVIDENCE = NO SUCCESS regression test
        run: node --import tsx --test --test-concurrency=1 tests/no-evidence-no-success.test.ts

      - name: Planner execution bridge test
        run: node --import tsx --test --test-concurrency=1 src/execution/plan-executor.test.ts

      - name: Task graph evidence identity test
        run: node --import tsx --test --test-concurrency=1 src/task-graph/task-graph.test.ts

      - name: Free-first OmniRoute router test
        run: npm run test:free-first-router

      - name: Jarvis route summary test
        run: npm run test:jarvis-route

      - name: Operational log mapping test
        run: npm run test:operational-logs

      - name: Persistence tenant context test
        run: npm run test:persistence-context

      - name: Telegram transport test
        run: npm run test:telegram

      - name: Memory Gateway contract test
        run: npm run test:memory-gateway

      - name: MemPalace adapter contract test
        run: npm run test:mempalace-adapter

      - name: MemPalace real MCP E2E smoke test
        run: npm run test:mempalace-e2e

      - name: Browser Use adapter contract test
        run: node --import tsx --test --test-concurrency=1 tests/browser-use-adapter.test.ts

      - name: Browser Use Temporal workflow test
        run: npm run test:browser-use-temporal

      - name: Vercel API routing smoke test
        run: node --import tsx --test --test-concurrency=1 tests/vercel-routing.test.mjs
