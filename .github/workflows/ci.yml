name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install

      - name: Install MemPalace
        run: python -m pip install 'mempalace==3.9.0'

      - name: Build
        run: npm run build

      - name: Lint / typecheck
        run: npm run lint

      - name: Workflow Studio must not fabricate live success
        run: node --test tests/workflow-studio-no-fake-success.test.mjs

      - name: Personal-mode authentication fail-closed test
        run: npm run test:auth-personal-mode

      - name: Live authenticated E2E (approval authorization)
        env:
          AUTH_E2E_SUPABASE_URL: ${{ secrets.AUTH_E2E_SUPABASE_URL }}
          AUTH_E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.AUTH_E2E_SUPABASE_PUBLISHABLE_KEY }}
          AUTH_E2E_TEST_EMAIL: ${{ secrets.AUTH_E2E_TEST_EMAIL }}
          AUTH_E2E_TEST_PASSWORD: ${{ secrets.AUTH_E2E_TEST_PASSWORD }}
          AUTH_E2E_MEMBER_ORG_ID: ${{ secrets.AUTH_E2E_MEMBER_ORG_ID }}
          AUTH_E2E_NON_MEMBER_ORG_ID: ${{ secrets.AUTH_E2E_NON_MEMBER_ORG_ID }}
        shell: bash
        run: |
          if [[ -n "$AUTH_E2E_SUPABASE_URL" && -n "$AUTH_E2E_SUPABASE_PUBLISHABLE_KEY" && -n "$AUTH_E2E_TEST_EMAIL" && -n "$AUTH_E2E_TEST_PASSWORD" && -n "$AUTH_E2E_MEMBER_ORG_ID" ]]; then
            npm run test:auth-e2e
          else
            echo "::notice title=Live Auth E2E skipped::Required AUTH_E2E test secrets are not configured; live authentication and approval authorization remain unverified."
          fi

      - name: Free-first OmniRoute router test
        run: npm run test:free-first-router

      - name: Jarvis route summary test
        run: npm run test:jarvis-route

      - name: Production guardrails test
        run: npm run test:production-guardrails

      - name: Operational log mapping test
        run: npm run test:operational-logs

      - name: Operational history organization context test
        run: npm run test:operational-history-context

      - name: Persistence tenant context test
        run: npm run test:persistence-context

      - name: OpenAI Responses adapter test
        run: node --import tsx --test --test-concurrency=1 tests/openai.test.ts

      - name: Database intent and verification truthfulness test
        run: node --import tsx --test --test-concurrency=1 tests/database-intent-verification.test.ts
      - name: Deterministic system health fallback test
        run: node --import tsx --test --test-concurrency=1 tests/system-health.test.ts
      - name: Canonical portfolio context test
        run: node --import tsx --test --test-concurrency=1 tests/portfolio-context.test.ts
      - name: Scholarship discovery intent and evidence test
        run: node --import tsx --test --test-concurrency=1 tests/scholarship-discovery.test.ts

      - name: Telegram transport test
        run: npm run test:telegram

      - name: Memory Gateway contract test
        run: npm run test:memory-gateway

      - name: MemPalace adapter contract test
        run: npm run test:mempalace-adapter

      - name: MemPalace real MCP E2E smoke test
        run: npm run test:mempalace-e2e

      - name: Browser Use adapter contract test
        run: node --import tsx --test --test-concurrency=1 tests/browser-use-adapter.test.ts
