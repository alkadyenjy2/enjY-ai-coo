name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint / typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Operational log mapping test
        run: npm run test:operational-logs

      - name: Browser Use adapter contract test
        run: node --import tsx --test --test-concurrency=1 tests/browser-use-adapter.test.ts
