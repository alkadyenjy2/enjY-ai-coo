name: Inngest migration verification

on:
  push:
    branches:
      - feat/inngest-command-orchestration
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Inngest and refresh lockfile
        run: npm install inngest@latest --package-lock-only

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh lockfile for Inngest"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Install from lockfile
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Inngest test
        run: node --import tsx --test --test-concurrency=1 tests/inngest-command.test.ts
