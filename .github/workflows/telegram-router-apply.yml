name: Apply Telegram router

on:
  push:
    paths:
      - ".github/workflows/telegram-router-apply.yml"
      - "src/api/telegram.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integrate Telegram router
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text()
          if 'createTelegramRouter' not in s:
              marker = 'import { gmailRouter } from "./src/api/agent/tools/gmail-router";'
              s = s.replace(marker, marker + '\nimport { createTelegramRouter, sendTelegramMessage } from "./src/api/telegram";')
          if 'app.use("/api/telegram", createTelegramRouter())' not in s:
              marker = 'app.use(express.json({ limit: "10mb" }));'
              s = s.replace(marker, marker + '\napp.use("/api/telegram", createTelegramRouter());')
          if 'jarvisTelegramHandler' not in s:
              marker = 'const app = express();'
              replacement = '''const app = express();\n\napp.locals.jarvisTelegramHandler = async ({ chatId, text }: { chatId: number; text: string }) => {\n  const response = await fetch(`http://127.0.0.1:${process.env.PORT || 3000}/api/agent/command`, {\n    method: "POST",\n    headers: { "content-type": "application/json" },\n    body: JSON.stringify({ prompt: text, userProfile: { source: "telegram", telegramChatId: chatId }, activeProject: "AI CORE COO", memoryContext: "", model: "gemini-3.6-flash" }),\n  });\n  const data = await response.json().catch(() => ({}));\n  if (!response.ok) throw new Error(data?.error || `JARVIS returned ${response.status}`);\n  const output = typeof data?.response === "string" ? data.response : typeof data?.message === "string" ? data.message : JSON.stringify(data);\n  await sendTelegramMessage(chatId, output);\n};'''
              s = s.replace(marker, replacement)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          npm run lint
          npm run build
      - name: Commit integration and retire workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts .github/workflows/telegram-router-apply.yml
          git commit -m "feat: wire Telegram webhook to JARVIS" || exit 0
          git rm .github/workflows/telegram-router-apply.yml
          git commit -m "chore: retire Telegram integration workflow"
          git push
